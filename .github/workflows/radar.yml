name: AI Radar

# Runs the radar on a schedule and commits the refreshed data back to main
# (git-scraping):
#   - radar.db persists the snapshot history so momentum accumulates across runs;
#   - web/public/data.json and the CSV are what the dashboard serves.
#
# Hosting is Vercel's Git integration (Root Directory: web): every push to main,
# including this bot's data commits, triggers a production deploy, and every PR
# gets a preview deploy. This workflow never builds or deploys the web app.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai_radar/**"
      - "requirements.txt"
      - ".github/workflows/radar.yml"

concurrency:
  group: ai-radar
  cancel-in-progress: false

permissions:
  contents: write     # commit the refreshed data

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run radar (scrape + snapshot + export data.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 5000 req/h for the API
        run: python -m ai_radar --days 45

      # No [skip ci] marker: pushes made with GITHUB_TOKEN never re-trigger
      # workflows anyway, and Vercel must deploy this commit.
      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.db web/public/data.json web/public/ai_radar_report.csv
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "chore(data): refresh radar snapshot"
            git push
          fi
