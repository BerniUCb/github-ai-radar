name: AI Radar

# Runs the radar on a schedule, then:
#   1. commits the updated radar.db back (git-scraping — persists the snapshot
#      history so momentum can accumulate across runs), and
#   2. builds the React dashboard and deploys it to GitHub Pages as a CI
#      artifact — docs/ is NOT committed, which is what stops local builds from
#      colliding with the bot's commits.
#
# One-time setup: Settings → Pages → Source → "GitHub Actions".

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai_radar/**"
      - "web/**"
      - ".github/workflows/radar.yml"

concurrency:
  group: ai-radar
  cancel-in-progress: false

permissions:
  contents: write     # commit radar.db
  pages: write        # deploy to Pages
  id-token: write     # required by deploy-pages

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run radar (scrape + snapshot + export data.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 5000 req/h for the API
        run: python -m ai_radar --days 45

      - name: Commit refreshed snapshot history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.db
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "chore(data): refresh radar snapshot [skip ci]"
            git push
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build   # emits ../docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
