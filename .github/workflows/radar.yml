name: AI Radar

# Git-scraping + build: the workflow runs the radar on a schedule, rebuilds the
# React dashboard, and commits the updated snapshot DB and built site (docs/)
# back to the repo. The committed radar.db is what lets momentum accumulate
# across runs; GitHub Pages serves docs/.

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ai_radar/**"
      - "web/**"
      - ".github/workflows/radar.yml"

concurrency:
  group: ai-radar
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run radar (scrape + snapshot + export data.json)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # 5000 req/h for the API
        run: python -m ai_radar --days 45

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build   # emits ../docs

      - name: Commit updated data and site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar.db docs/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): refresh radar snapshot and dashboard [skip ci]"
            git push
          fi
